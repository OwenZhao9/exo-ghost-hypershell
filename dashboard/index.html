<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Exo Ghost 监视器</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="app">
<header>
  <span id="state" class="badge OFFLINE">未连接</span>
  <div class="stat"><span class="l">左髋</span><span class="v" id="vL">—</span></div>
  <div class="stat"><span class="l">右髋</span><span class="v" id="vR">—</span></div>
  <div class="stat"><span class="l">τ 左 / 右 Nm</span><span class="v" id="vT">—</span></div>
  <div class="stat"><span class="l">策略</span><span class="v" id="vP" style="font-size:15px">—</span></div>
  <div class="stat"><span class="l">数据流</span><span class="v" id="vHz" style="font-size:15px">—</span></div>
  <div class="stat"><span class="l">做功 J</span><span class="v" id="vW" style="font-size:15px">—</span></div>
  <div class="spacer"></div>
  <div class="tools">
    <a href="demo.html" target="_blank" rel="noopener">现场演示 ↗</a>
    <a href="twin.html" target="_blank" rel="noopener">3D 外骨骼 ↗</a>
    <div class="seg" id="win"><button data-w="5">5s</button><button data-w="10" class="on">10s</button><button data-w="30">30s</button><button data-w="60">60s</button></div>
    <button id="pause">⏸ 暂停</button>
    <button id="imu">腰部数据</button>
  </div>
  <span class="foot" style="width:100%"><span class="dot" id="dot"></span><span id="conn">未连接</span> · <span id="addr"></span></span>
</header>

<main>
  <section class="charts" id="charts"></section>
  <aside>
    <div class="card">
      <button class="estop" id="estop">急　停</button>
      <button class="arm" id="arm" style="display:none">确认安全，重新武装</button>
    </div>
    <div class="card">
      <h3>策略</h3>
      <div class="row"><button data-p="zero">松劲</button><button data-p="resist">阻尼</button><button data-p="assist">助力</button></div>
      <label class="sl">增益 <input type="range" id="sg" min="0" max="1" step="0.05" value="0.5"><b id="sgv">0.50</b></label>
      <label class="sl">上限 <input type="range" id="sm" min="0.2" max="2" step="0.1" value="1.5"><b id="smv">1.5 Nm</b></label>
      <button class="apply" id="apply">应用</button>
      <p class="foot" style="margin:9px 0 0">阻尼 = 越快越沉；助力 = 顺势推一把（自动限幅）。力矩按 1–3 Nm/s 缓慢加载。</p>
    </div>
    <div class="card ghost">
      <h3>Ghost 三层</h3>
      <div class="glayer"><span class="gtag reflex">反射</span><span class="ghz">每帧 · fly-reflex</span>
        <div id="gReflex"></div></div>
      <div class="glayer"><span class="gtag intuit">直觉</span><span class="ghz">每 2 秒 · jev-decide</span>
        <div id="gDecide"></div></div>
      <div class="glayer"><span class="gtag memo">经验</span><span class="ghz">遇事即查 · evomap-genes</span>
        <div id="gMemory"></div></div>
    </div>
    <div class="card"><h3>事件</h3><div class="log" id="log"></div></div>
  </aside>
</main>
</div>
<script src="ghost.js"></script>
<script src="app.js"></script>
</body>
</html>
